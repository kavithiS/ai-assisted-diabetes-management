# DiaCare AI local stack. From the repository root:
#   docker compose -f infra/docker-compose.yml up --build
# Values below fall back to development defaults; override them through the environment.

x-service-env: &service-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER:-diacare}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-diacare}
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diacare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-diacare}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diacare} -d ${POSTGRES_DB:-diacare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  c1_food_nutrition:
    build:
      context: ..
      dockerfile: server/services/c1_food_nutrition/Dockerfile
    environment: *service-env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  c2_glycemic_forecasting:
    build:
      context: ..
      dockerfile: server/services/c2_glycemic_forecasting/Dockerfile
    environment: *service-env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  c3_risk_xai:
    build:
      context: ..
      dockerfile: server/services/c3_risk_xai/Dockerfile
    environment: *service-env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  c4_foot_monitoring:
    build:
      context: ..
      dockerfile: server/services/c4_foot_monitoring/Dockerfile
    environment: *service-env
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: server/gateway/Dockerfile
    environment:
      <<: *service-env
      C1_URL: http://c1_food_nutrition:8001
      C2_URL: http://c2_glycemic_forecasting:8002
      C3_URL: http://c3_risk_xai:8003
      C4_URL: http://c4_foot_monitoring:8004
    ports:
      - "8000:8000"
    depends_on:
      - c1_food_nutrition
      - c2_glycemic_forecasting
      - c3_risk_xai
      - c4_foot_monitoring

volumes:
  postgres-data:
  mlflow-data:
