[project]
name = "diacare-shared"
version = "0.1.0"
description = "Shared configuration, logging and health helpers for DiaCare AI services"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
