[project]
name = "diacare-gateway"
version = "0.1.0"
description = "DiaCare AI API gateway: routing and orchestration for the C1–C4 services"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=23.1",
    "diacare-shared",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.9",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
diacare-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
