[project]
name = "c1-food-nutrition"
version = "0.1.0"
description = "C1 Food Recognition & Nutritional Analysis service (DiaCare AI research prototype)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "diacare-shared",
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
diacare-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
