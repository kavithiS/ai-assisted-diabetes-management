[project]
name = "c3-risk-xai"
version = "0.1.0"
description = "C3 Multi-Factor Diabetic Risk Profiling & XAI service (DiaCare AI research prototype)"
requires-python = ">=3.11,<3.12"
# ML versions are pinned so trained models and reported results stay reproducible.
dependencies = [
    "diacare-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "shap==0.46.0",
    "lime==0.2.0.1",
    "matplotlib==3.9.2",
    "joblib==1.4.2",
    "pyyaml>=6.0.2",
    # Imported directly (synthetic.py, schemas.py), so declared here rather than relying on
    # scikit-learn / FastAPI to bring them in. Lower bounds only: nothing is downgraded.
    "scipy>=1.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# PP1 research demo only; not a service dependency (Streamlit use is an open question).
demo = ["streamlit>=1.38"]

[tool.uv.sources]
diacare-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
